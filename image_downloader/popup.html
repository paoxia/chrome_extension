<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>网页图片下载器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 360px;
      max-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
    }
    .header {
      padding: 12px 16px;
      background-color: #007AFF;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 8px 8px 0 0;
    }
    .header-title {
      font-size: 14px;
      font-weight: 600;
    }
    .header-count {
      font-size: 12px;
      background-color: rgba(255,255,255,0.3);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .status-bar {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #ffffff;
      border-bottom: 1px solid #e5e5e7;
    }
    .status-badge {
      font-size: 12px;
      color: #666;
    }
    .status-badge.scanning {
      color: #007AFF;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .filter-row {
      padding: 8px 16px;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .filter-label {
      font-size: 12px;
      color: #666;
    }
    .filter-select {
      flex: 1;
      padding: 4px 8px;
      border: 1px solid #e5e5e7;
      border-radius: 6px;
      font-size: 12px;
      background-color: white;
    }
    .actions-row {
      padding: 8px 16px;
      background-color: #ffffff;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #e5e5e7;
    }
    .action-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .action-btn.primary {
      background-color: #007AFF;
      color: white;
    }
    .action-btn.primary:hover {
      background-color: #0066cc;
    }
    .action-btn.secondary {
      background-color: #f5f5f7;
      color: #1d1d1f;
    }
    .action-btn.secondary:hover {
      background-color: #e5e5e7;
    }
    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .image-list {
      max-height: 300px;
      overflow-y: auto;
      padding: 8px;
    }
    .image-list::-webkit-scrollbar {
      width: 4px;
    }
    .image-list::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    .image-list::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 2px;
    }
    .image-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      margin-bottom: 6px;
      background-color: #ffffff;
      border-radius: 8px;
      border: 1px solid #e5e5e7;
    }
    .image-thumb {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
      background-color: #f5f5f7;
    }
    .image-info {
      flex: 1;
      min-width: 0;
    }
    .image-name {
      font-size: 12px;
      color: #1d1d1f;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .image-meta {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
      display: flex;
      gap: 8px;
    }
    .image-size, .image-dim {
      font-size: 10px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .btn-group button {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }
    .btn-group button:hover {
      background-color: #f0f0f0;
    }
    .copy-btn {
      background-color: #f5f5f7;
      color: #666;
    }
    .download-btn {
      background-color: #007AFF;
      color: white;
    }
    .empty-state {
      text-align: center;
      padding: 30px 20px;
    }
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .empty-state-title {
      font-size: 14px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 4px;
    }
    .empty-state-desc {
      font-size: 12px;
      color: #888;
    }
    .toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0,0,0,0.8);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">图片下载器</div>
    <div class="header-count" id="imageCount">0</div>
  </div>
  <div class="status-bar">
    <div class="status-badge" id="statusBadge">就绪</div>
    <button class="action-btn secondary" id="refreshBtn" style="flex: none; padding: 4px 12px;">刷新</button>
  </div>
  <div class="filter-row">
    <span class="filter-label">最小尺寸:</span>
    <select class="filter-select" id="filterSelect">
      <option value="0">全部</option>
      <option value="10">10KB以上</option>
      <option value="50">50KB以上</option>
      <option value="100">100KB以上</option>
      <option value="500">500KB以上</option>
    </select>
  </div>
  <div class="actions-row">
    <button class="action-btn primary" id="downloadAllBtn">全部下载</button>
    <button class="action-btn secondary" id="clearBtn">清空列表</button>
  </div>
  <div class="image-list" id="imageList">
    <div class="empty-state">
      <div class="empty-state-icon">🖼️</div>
      <div class="empty-state-title">未检测到图片</div>
      <div class="empty-state-desc">正在自动检测当前页面图片...</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
