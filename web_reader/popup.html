<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI 阅读器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 390px;
      margin: 0;
      color: #1d1d1f;
      background: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    .container { padding: 16px; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .logo-icon {
      display: flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; border-radius: 10px; color: white;
      background: linear-gradient(135deg, #007aff, #5856d6);
      box-shadow: 0 3px 10px rgba(0, 122, 255, 0.25);
    }
    h1 { margin: 0; font-size: 17px; font-weight: 650; }
    .provider-badge { color: #86868b; font-size: 10px; }
    .config-btn {
      width: auto; margin-left: auto; padding: 6px 10px; border: 0; border-radius: 7px;
      color: #007aff; background: transparent; cursor: pointer; font-size: 12px;
    }
    .config-btn:hover, .config-btn.active { color: white; background: #007aff; }
    .card {
      margin-bottom: 10px; padding: 13px; border: 1px solid #ebeef2;
      border-radius: 12px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }
    .config-section { display: none; }
    .config-section.show { display: block; }
    .config-title { margin-bottom: 11px; color: #6e6e73; font-size: 11px; font-weight: 650; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 600; }
    .form-group input, .form-group select {
      width: 100%; padding: 8px 9px; border: 1px solid #d2d2d7; border-radius: 7px;
      color: #1d1d1f; background: #fafafa; outline: none; font-size: 12px;
    }
    .form-group input:focus, .form-group select:focus { border-color: #007aff; background: white; }
    .hint { margin-top: 4px; color: #86868b; font-size: 10px; line-height: 1.4; }
    .codex-command {
      padding: 7px; border-radius: 6px; color: #3a3a3c; background: #f2f2f7;
      font-family: Consolas, monospace; font-size: 9px; word-break: break-all;
    }
    .provider-fields[hidden] { display: none; }
    .button-row { display: flex; gap: 7px; }
    button.action {
      flex: 1; padding: 10px 9px; border: 0; border-radius: 9px; color: white;
      cursor: pointer; font-size: 12px; font-weight: 600;
    }
    button:disabled { cursor: wait !important; opacity: .55; }
    .summary-btn { background: #5856d6; }
    .translate-btn { background: #007aff; }
    .save-btn { color: white !important; background: #34c759 !important; }
    .test-btn { color: #1d1d1f !important; background: #efeff4 !important; }
    .mode-controls { display: flex; align-items: center; gap: 5px; }
    .mode-controls[hidden] { display: none; }
    .mode-label { margin-right: auto; color: #6e6e73; font-size: 10px; }
    .mode-btn, .clear-btn {
      width: auto; padding: 6px 8px; border: 0; border-radius: 7px;
      color: #3a3a3c; background: #efeff4; cursor: pointer; font-size: 10px;
    }
    .mode-btn.active { color: white; background: #007aff; }
    .clear-btn { color: #ff3b30; background: #fff0ef; }
    #status { min-height: 18px; padding: 1px 3px 8px; color: #86868b; font-size: 11px; text-align: center; }
    #status.success { color: #248a3d; }
    #status.error { color: #ff3b30; }
    #result {
      display: none; max-height: 250px; overflow-y: auto; margin-top: 10px; padding: 12px;
      border-radius: 10px; color: #2c2c2e; background: white; box-shadow: 0 1px 5px rgba(0,0,0,.06);
      white-space: pre-wrap; font-size: 12px; line-height: 1.6;
    }
    #result.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-icon">📖</div>
      <div>
        <h1>AI 阅读器</h1>
        <div class="provider-badge" id="providerBadge">OpenAI 兼容 API</div>
      </div>
      <button id="configBtn" class="config-btn">配置</button>
    </div>

    <section class="card config-section" id="configSection">
      <div class="config-title">AI 服务配置</div>
      <div class="form-group">
        <label for="provider">服务类型</label>
        <select id="provider">
          <option value="openai">OpenAI 兼容 API</option>
          <option value="codex-native">本地 Codex（Native，推荐）</option>
        </select>
      </div>

      <div class="provider-fields" id="openaiFields">
        <div class="form-group">
          <label for="apiUrl">API 地址</label>
          <input id="apiUrl" type="text" placeholder="https://api.openai.com/v1">
        </div>
        <div class="form-group">
          <label for="apiKey">API Key（可选）</label>
          <input id="apiKey" type="password" placeholder="本地兼容服务可留空">
        </div>
        <div class="form-group">
          <label for="modelName">模型名称</label>
          <input id="modelName" type="text" placeholder="填写兼容 API 支持的模型">
        </div>
      </div>

      <div class="provider-fields" id="nativeCodexFields" hidden>
        <div class="hint">无需启动后台服务。首次使用需安装一次 Native Host，之后由 Chrome 自动调用本地 Codex CLI。</div>
        <div class="codex-command">首次安装请查看 web_reader/README.md</div>
      </div>

      <div class="provider-fields" id="codexSharedFields" hidden>
        <div class="form-group">
          <label for="codexModel">Codex 模型（可选）</label>
          <input id="codexModel" type="text" placeholder="留空使用 Codex 默认模型">
        </div>
      </div>

      <div class="form-group">
        <label for="targetLanguage">翻译目标语言</label>
        <select id="targetLanguage">
          <option value="简体中文">简体中文</option>
          <option value="繁体中文">繁体中文</option>
          <option value="English">English</option>
          <option value="日本語">日本語</option>
          <option value="한국어">한국어</option>
          <option value="Español">Español</option>
        </select>
      </div>
      <div class="form-group">
        <label for="translationMode">翻译后默认显示</label>
        <select id="translationMode">
          <option value="bilingual">双语对照</option>
          <option value="translated">仅译文</option>
          <option value="original">保留原文</option>
        </select>
      </div>
      <div class="button-row">
        <button id="saveBtn" class="action save-btn">保存</button>
        <button id="testBtn" class="action test-btn">测试连接</button>
      </div>
    </section>

    <section class="card">
      <div class="button-row">
        <button id="summarizeBtn" class="action summary-btn">总结当前网页</button>
        <button id="translateBtn" class="action translate-btn">翻译当前网页</button>
      </div>
    </section>

    <section class="card mode-controls" id="translationControls" hidden>
      <span class="mode-label">页面显示</span>
      <button class="mode-btn" data-mode="original">原文</button>
      <button class="mode-btn" data-mode="bilingual">双语</button>
      <button class="mode-btn" data-mode="translated">译文</button>
      <button class="clear-btn" id="clearTranslationBtn">移除</button>
    </section>

    <div id="status"></div>
    <div id="result"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
