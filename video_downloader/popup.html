<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>网页视频下载器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 360px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .header-icon { font-size: 18px; }
    .header h1 {
      font-size: 16px;
      margin: 0;
      color: #1d1d1f;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    .status-badge {
      font-size: 10px;
      padding: 3px 10px;
      border-radius: 20px;
      background: #007aff;
      color: white;
      margin-left: auto;
      font-weight: 500;
      transition: background 0.2s;
    }
    .status-badge.scanning { background: #f59e0b; }
    .status-badge.success { background: #34c759; }
    .status-badge.error { background: #ff3b30; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .stats-text { font-size: 12px; color: #86868b; }
    .video-count {
      font-size: 12px;
      font-weight: 600;
      color: #1d1d1f;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }
    .filter-label { font-size: 11px; color: #86868b; }
    .filter-select {
      font-size: 11px;
      padding: 3px 8px;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      background: white;
      color: #1d1d1f;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .filter-select:hover, .filter-select:focus { border-color: #007aff; }
    .notice {
      margin: -4px 0 10px;
      padding: 7px 9px;
      border-radius: 7px;
      font-size: 11px;
      line-height: 1.4;
      background: #eaf5ff;
      color: #1267b5;
    }
    .notice.error { background: #fff0ef; color: #c5221f; }
    .video-list {
      background: white;
      border-radius: 14px;
      padding: 6px;
      max-height: 400px;
      overflow-y: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .video-list::-webkit-scrollbar { width: 6px; }
    .video-list::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 3px; }
    .video-list::-webkit-scrollbar-track { background: transparent; }
    .video-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 4px;
      background: #fafafa;
      transition: all 0.2s;
    }
    .video-item:hover {
      background: #f0f0f2;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .video-item:last-child { margin-bottom: 0; }
    .video-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 50%, #f39c12 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.35);
      position: relative;
      overflow: hidden;
    }
    .video-icon::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      transform: rotate(30deg);
    }
    .video-info { flex: 1; min-width: 0; }
    .video-name-input {
      width: 100%;
      font-size: 13px;
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: -0.1px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      padding: 2px 4px;
      outline: none;
    }
    .video-name-input:hover { border-color: #d2d2d7; background: white; }
    .video-name-input:focus { border-color: #007aff; background: white; }
    .video-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }
    .video-size { font-size: 11px; color: #86868b; }
    .video-type {
      font-size: 9px;
      color: #007aff;
      background: rgba(0, 122, 255, 0.08);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 500;
    }
    .btn-group { display: flex; gap: 6px; flex-shrink: 0; }
    .action-btn {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-size: 14px;
    }
    .download-btn { background: #34c759; }
    .download-btn:hover { background: #30b853; box-shadow: 0 2px 8px rgba(52, 199, 89, 0.3); }
    .thunder-btn { background: #1683ff; }
    .thunder-btn:hover { background: #0874e8; box-shadow: 0 2px 8px rgba(22, 131, 255, 0.3); }
    .action-btn:disabled { cursor: wait; opacity: 0.65; }
    .action-btn:active { transform: scale(0.92); }
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: #86868b;
    }
    .empty-state-icon { font-size: 44px; margin-bottom: 14px; opacity: 0.6; }
    .empty-state-title {
      font-size: 13px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 4px;
    }
    .empty-state-desc { font-size: 11px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">📥</span>
    <h1>网页视频下载器</h1>
    <span class="status-badge" id="statusBadge">就绪</span>
  </div>

  <div class="toolbar">
    <span class="stats-text">当前页面视频</span>
    <span class="video-count" id="videoCount">0</span>
    <div class="filter-group">
      <span class="filter-label">最小显示</span>
      <select class="filter-select" id="filterSelect">
        <option value="0">全部</option>
        <option value="1">1 MB</option>
        <option value="5">5 MB</option>
        <option value="10">10 MB</option>
        <option value="50">50 MB</option>
      </select>
    </div>
  </div>

  <div class="notice" id="notice" hidden></div>

  <div class="video-list" id="videoList">
    <div class="empty-state">
      <div class="empty-state-icon">🎬</div>
      <div class="empty-state-title">未检测到视频</div>
      <div class="empty-state-desc">正在自动检测当前页面视频...</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
